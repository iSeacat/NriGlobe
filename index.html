<script>
(function () {
  "use strict";
  if (!window.NRI_DATA || !window.WORLD_LAND) {
    document.body.innerHTML = '<div style="padding:40px;color:#ff8">数据文件缺失：请先运行 python scripts/build.py 生成 data/dataset.js 与 data/world.js</div>';

  var DATA = window.NRI_DATA;
  var LAND = window.WORLD_LAND;
  var R = 100;

  // ---------------------------------------------------------------- 状态
  var today = DATA.dates[DATA.dates.length - 1];
  var state = {
    mode: "all",            // today | date | all
    date: today,
    types: { news: true, pain: true },
    lines: {},              // line -> bool
    sel: null,              // 选中的 market id
    q: "",
    spin: true,
    cruise: false,
    speed: 0.15
  };
  Object.keys(DATA.product_lines || {}).forEach(function (k) { state.lines[k] = true; });
  state.lines["每日新闻"] = true;

  var el = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------------------------------------------------------------- three 基础
  var stage = el("stage");
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 1, 4000);
  var camDist = 330;
  camera.position.set(0, 0, camDist);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  // ---------------------------------------------------------------- 光照：太阳主光 + 背面冷补光
  scene.add(new THREE.AmbientLight(0x5f88bd, 0.46));
  var sun = new THREE.DirectionalLight(0xfff2dd, 1.18);
  sun.position.set(-0.82, 0.46, 1.15);
  scene.add(sun);
  var rimLight = new THREE.DirectionalLight(0x4f8ee2, 0.55);
  rimLight.position.set(1.1, -0.32, -0.9);
  scene.add(rimLight);
  var SUN_DIR = sun.position.clone().normalize();

  // ---------------------------------------------------------------- 通用绘图小工具
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeGlowTex(mid) {
    var s = 128, cv = document.createElement("canvas");
    cv.width = cv.height = s;
    var c = cv.getContext("2d");
    var g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(mid, "rgba(255,255,255,0.42)");
    g.addColorStop(1, "rgba(255,255,255,0)");

  // ---------------------------------------------------------------- 地球贴图（海洋 / 陆地 / 云层）
  function drawPaths(ctx, fn, W, H) {
    LAND.countries.forEach(function (cty) {
      cty.rings.forEach(function (ring) {
        ctx.beginPath();
        for (var i = 0; i < ring.length; i++) {
          var px = (ring[i][0] + 180) / 360 * W;
          var py = (90 - ring[i][1]) / 180 * H;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        fn(ctx);

  // 陆地：纬度生物群系渐变（冰盖→针叶林→赤道雨林）+ 地形颗粒质感
  function buildLandCanvas(W, H) {
    var lc = newCanvas(W, H), l = lc.getContext("2d");
    // 基础陆地色（会被下方纬度生物群系渐变覆盖）
    l.fillStyle = "#4f8a5b";
    drawPaths(l, function (cc) { cc.fill(); }, W, H);

    // 纬度生物群系：极地冰盖 → 针叶林 → 温带 → 赤道雨林，南/北对称
    l.globalCompositeOperation = "source-atop";
    var bg = l.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0.00, "#e9f1f6");
    bg.addColorStop(0.10, "#cfe0d2");
    bg.addColorStop(0.24, "#6fa05c");
    bg.addColorStop(0.42, "#4f8a4f");
    bg.addColorStop(0.50, "#3f7a48");
    bg.addColorStop(0.58, "#4f8a4f");
    bg.addColorStop(0.76, "#6fa05c");
    bg.addColorStop(0.90, "#cfe0d2");
    bg.addColorStop(1.00, "#e9f1f6");
    l.fillStyle = bg;
    l.fillRect(0, 0, W, H);

    // 地形颗粒（只落在陆地上，制造明暗斑驳）
    var nz = newCanvas(256, 256), nzx = nz.getContext("2d");
    var img = nzx.createImageData(256, 256), dd = img.data;
    var rnd = mulberry32(4242);
    for (var i = 0; i < dd.length; i += 4) {
      var v = rnd();
      if (v < 0.55) { dd[i + 3] = 0; continue; }
      var dark = v < 0.80;
      dd[i] = dd[i + 1] = dd[i + 2] = dark ? 0 : 255;
      dd[i + 3] = 18 + Math.random() * 26;
    }
    nzx.putImageData(img, 0, 0);
    l.globalCompositeOperation = "source-atop";
    l.fillStyle = l.createPattern(nz, "repeat");
    l.fillRect(0, 0, W, H);
    l.globalCompositeOperation = "source-over";
    return lc;
  }

  function buildTexture() {
    var W = 4096, H = 2048;
    var cv = newCanvas(W, H), c = cv.getContext("2d");

    // 海洋底色：深蓝，赤道略亮、两极近墨
    var gsea = c.createLinearGradient(0, 0, 0, H);
    gsea.addColorStop(0.00, "#04101f");
    gsea.addColorStop(0.18, "#072033");
    gsea.addColorStop(0.50, "#0a2c4d");
    gsea.addColorStop(0.82, "#072033");
    gsea.addColorStop(1.00, "#04101f");
    c.fillStyle = gsea; c.fillRect(0, 0, W, H);

    // 海盆起伏（随机柔光斑）
    var rnd = mulberry32(20260914);
    c.globalCompositeOperation = "lighter";
    for (var b = 0; b < 320; b++) {
      var bx = rnd() * W, by = 100 + rnd() * (H - 200), br = 90 + rnd() * 360;
      var rg = c.createRadialGradient(bx, by, 0, bx, by, br);
      rg.addColorStop(0, "rgba(60,140,215,0.085)");
      rg.addColorStop(1, "rgba(60,140,215,0)");
      c.fillStyle = rg;
      c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2); c.fill();
    }
    c.globalCompositeOperation = "source-over";

    // 经纬网格（极淡，仅作科技质感）
    c.strokeStyle = "rgba(120,180,255,0.045)"; c.lineWidth = 1;
    for (var lon = -180; lon <= 180; lon += 15) {
      var x = (lon + 180) / 360 * W;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
    }
    for (var lat = -75; lat <= 75; lat += 15) {
      var y = (90 - lat) / 180 * H;
      c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    }

    // 大陆架泛光：多层递减描边（柔和青蓝）
    c.globalCompositeOperation = "lighter";
    [[34, 0.022], [20, 0.034], [11, 0.05], [5, 0.065]].forEach(function (p) {
      c.lineWidth = p[0];
      c.strokeStyle = "rgba(70,150,225," + p[1] + ")";
      drawPaths(c, function (cc) { cc.stroke(); }, W, H);
    });
    c.globalCompositeOperation = "source-over";

    // 陆地
    c.drawImage(buildLandCanvas(W, H), 0, 0);

    // 海岸线：宽窄两道描边模拟外发光
    c.globalCompositeOperation = "lighter";
    c.strokeStyle = "rgba(150,215,255,0.10)"; c.lineWidth = 2.6;
    drawPaths(c, function (cc) { cc.stroke(); }, W, H);
    c.strokeStyle = "rgba(205,238,255,0.34)"; c.lineWidth = 0.9;
    drawPaths(c, function (cc) { cc.stroke(); }, W, H);
    c.globalCompositeOperation = "source-over";

    return toTexture(cv, true);
  }

  // 海洋高光遮罩：白=反光（海面），黑=哑光（陆地）
  function buildOceanMask() {
    var W = 2048, H = 1024;
    var cv = newCanvas(W, H), c = cv.getContext("2d");
    c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, H);
    c.fillStyle = "#000000";
    drawPaths(c, function (cc) { cc.fill(); }, W, H);
    var cv2 = newCanvas(W, H), c2 = cv2.getContext("2d");
    try { c2.filter = "blur(4px)"; } catch (e) { }
    c2.drawImage(cv, 0, 0);
    return toTexture(cv2, false);
  }

  // 程序化云图（value-noise fbm + 纬度云带），带 alpha 通道
  function buildCloudTexture() {
    var W = 1024, H = 512;
    var cv = newCanvas(W, H), c = cv.getContext("2d");
    var img = c.createImageData(W, H), d = img.data;
    var rnd = mulberry32(90210);
    var amps = [0.50, 0.26, 0.14, 0.07, 0.03], tot = 0;
    amps.forEach(function (a) { tot += a; });
    var octs = [4, 8, 16, 32, 64].map(function (g) {
      var cols = g, rows = Math.max(2, g / 2), arr = new Float32Array(cols * rows);
      for (var i = 0; i < arr.length; i++) arr[i] = rnd();
      return { cols: cols, rows: rows, a: arr };
    });
    function wrapX(i, cols) { return ((i % cols) + cols) % cols; }
    function fade(t) { return t * t * (3 - 2 * t); }
    function samp(o, u, v) {
      var fx = u * o.cols, fy = v * (o.rows - 1);
      var x0 = Math.floor(fx), y0 = Math.min(o.rows - 2, Math.floor(fy));
      var tx = fade(fx - x0), ty = fade(fy - y0);
      var x1 = x0 + 1, y1 = Math.min(o.rows - 1, y0 + 1);
      var c00 = o.a[y0 * o.cols + wrapX(x0, o.cols)];
      var c10 = o.a[y0 * o.cols + wrapX(x1, o.cols)];
      var c01 = o.a[y1 * o.cols + wrapX(x0, o.cols)];
      var c11 = o.a[y1 * o.cols + wrapX(x1, o.cols)];
      return (c00 * (1 - tx) + c10 * tx) * (1 - ty) + (c01 * (1 - tx) + c11 * tx) * ty;
    }
    for (var py = 0; py < H; py++) {
      var v = py / (H - 1);
      var lat = 90 - v * 180;
      var belt = 0.46
        + 0.40 * Math.exp(-Math.pow(lat / 12, 2))
        + 0.34 * Math.exp(-Math.pow((Math.abs(lat) - 52) / 20, 2))
        - 0.30 * Math.exp(-Math.pow((Math.abs(lat) - 26) / 12, 2));
      if (belt < 0) belt = 0; else if (belt > 1) belt = 1;
      var edge = 0.70 - belt * 0.34;
      for (var px = 0; px < W; px++) {
        var n = 0;
        for (var k = 0; k < octs.length; k++) n += amps[k] * samp(octs[k], px / W, v);
        n /= tot;
        var t = (n - edge) / 0.13;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        var al = t * t * (3 - 2 * t);
        var idx = (py * W + px) * 4;
        d[idx] = d[idx + 1] = d[idx + 2] = 255;
        d[idx + 3] = (al * 240) | 0;
      }
    }
    c.putImageData(img, 0, 0);
    return toTexture(cv, true);
  }

      fragmentShader: [
        "uniform vec3 uSun; varying vec3 vN; varying vec3 vP;",

        "  float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), 3.2);",
        "  float lit = 0.45 + 0.55 * max(0.0, dot(normalize(vN), normalize(uSun)));",
        "  vec3 col = mix(vec3(0.20,0.50,0.95), vec3(0.70,0.90,1.0), f);",

  // 双层大气光晕
  function makeAtmosphere(radius, power, intensity) {
    var m = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 72, 48),
      new THREE.ShaderMaterial({
        uniforms: { uPow: { value: power }, uInt: { value: intensity } },
        vertexShader: "varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: [
          "uniform float uPow; uniform float uInt; varying vec3 vN;",
          "void main(){",
          "  float f = pow(max(0.0, 0.72 - dot(vN, vec3(0.0,0.0,1.0))), uPow);",
          "  gl_FragColor = vec4(0.33,0.65,1.0,1.0) * f * uInt;",
          "}"
        ].join("\n"),

    );
    m.renderOrder = 1;

  }

  // ---------------------------------------------------------------- 坐标工具
  function latLon(lat, lon, rr) {

    return new THREE.Vector3(
      -rr * Math.sin(phi) * Math.cos(theta),
      rr * Math.cos(phi),
      rr * Math.sin(phi) * Math.sin(theta)
    );
  }
  function viewRotation(lat, lon) {
    var p = latLon(lat, lon, R);
    var ry = Math.atan2(-p.x, p.z);
    var rx = Math.atan2(p.y, Math.hypot(p.x, p.z));
    return { y: ry, x: Math.max(-0.85, Math.min(0.85, rx)) };
  }

  // ---------------------------------------------------------------- 标记节点

  // ---------------------------------------------------------------- 过滤与聚合
  function activeDate() {
    return state.mode === "today" ? today : (state.mode === "date" ? state.date : null);
  }
  function matches(it) {
    if (!state.types[it.type]) return false;
    if (!state.lines[it.line]) return false;
    var d = activeDate();
    return d === null || it.dates.indexOf(d) >= 0;
  }
  function rebuild() {
    nodeList.forEach(function (n) {
      n.items = []; n.news = 0; n.pain = 0; n.high = 0; n.glob = 0; n.count = 0;
    });
    var total = 0, used = 0, highN = 0, newsN = 0, painN = 0;
    DATA.items.forEach(function (it) {
      if (!matches(it)) return;
      total++;
      if (it.type === "news") newsN++; else painN++;
      if (it.severity === "high") highN++;
      it.markets.forEach(function (mid) {
        var n = nodes[mid];
        if (!n) return;
        n.items.push(it); n.count++;
        if (it.type === "news") n.news++; else n.pain++;
        if (it.severity === "high") n.high++;
        if (it.global) n.glob++;
      });
    });
    nodeList.forEach(function (n) {
      n.target = n.count > 0 ? 1 : 0;
      used += n.count > 0 ? 1 : 0;
      var col;
      if (n.high > 0) col = COL.high;
      else if (n.pain > n.news) col = COL.pain;
      else col = COL.news;
      n.baseCol = col;
      var isSel = (state.sel === n.m.id);
      var useCol = isSel ? COL.sel : col;   // 选中改用柔和蓝紫，不再用红色放大
      n.core.material.color.setHex(useCol);
      n.halo.material.color.setHex(useCol);
      n.halo.material.opacity = isSel ? 0.9 : 0.7;
      for (var ri = 0; ri < n.ripples.length; ri++) n.ripples[ri].material.color.setHex(useCol);
      n.beam.material.color.setHex(useCol);
    });
    return { total: total, used: used, high: highN, news: newsN, pain: painN };
  }

      c.onclick = function () {
        var k = c.getAttribute("data-t");
        state.types[k] = !state.types[k];
        if (!state.types.news && !state.types.pain) state.types[k] = true; // 至少保留一个维度
        refresh();
      };
    });

    // 产品线
    var lines = Object.keys(state.lines);
    el("lines").innerHTML = lines.map(function (l) {
      var cnt = DATA.items.filter(function (i) { return i.line === l && (activeDate() === null || i.dates.indexOf(activeDate()) >= 0); }).length;
      var nm = (DATA.product_lines && DATA.product_lines[l]) ? DATA.product_lines[l] : l;
      return '<div class="chip' + (state.lines[l] ? " on" : "") + '" data-l="' + esc(l) + '">' + esc(nm) + '<span class="n">' + cnt + '</span></div>';
    }).join("");
    Array.prototype.forEach.call(el("lines").children, function (c) {
      c.onclick = function () {
        var l = c.getAttribute("data-l");
        var another = Object.keys(state.lines).some(function (k) { return k !== l && state.lines[k]; });
        state.lines[l] = !state.lines[l];
        if (!another && !state.lines[l]) { Object.keys(state.lines).forEach(function (k) { state.lines[k] = true; }); }
        refresh();
      };
    });

    // 国家列表
    var q = state.q.trim().toLowerCase();
    var rows = nodeList.filter(function (n) {
      if (n.count === 0) return false;
      if (!q) return true;
      return n.m.name.indexOf(state.q.trim()) >= 0 || n.m.en.toLowerCase().indexOf(q) >= 0 || n.m.id.toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) {
      return b.count - a.count || b.high - a.high;
    });
    el("mlist").innerHTML = rows.length ? rows.map(function (n) {
      var col = n.high > 0 ? "#ff6272" : (n.pain > n.news ? "#ffb056" : "#4fd6ff");
      return '<div class="mrow' + (state.sel === n.m.id ? " on" : "") + '" data-m="' + n.m.id + '">' +
        '<span class="dot" style="background:' + col + '"></span>' +
        '<span class="nm">' + esc(n.m.name) + '</span>' +
        '<span class="ct">' + n.count + '</span></div>';
    }).join("") : '<div class="empty">当前筛选下没有国家</div>';
    Array.prototype.forEach.call(el("mlist").querySelectorAll(".mrow"), function (c) {
      c.onclick = function () { select(c.getAttribute("data-m"), true); };
    });
  }
  function matchesIgnoreType(it) {
    if (!state.lines[it.line]) return false;
    var d = activeDate();
    return d === null || it.dates.indexOf(d) >= 0;
  }

  function sevTag(s) {
    if (s === "high") return '<span class="tag high">🔴 高</span>';
    if (s === "mid") return '<span class="tag mid">🟡 中</span>';
    if (s === "low") return '<span class="tag low">🟢 低</span>';
    return "";
  }

  function itemCard(it) {
    var meta = [];
    meta.push('<span class="tag line">' + esc((DATA.product_lines && DATA.product_lines[it.line]) ? DATA.product_lines[it.line] : it.line) + '</span>');
    if (it.severity && it.severity !== "unknown") meta.push(sevTag(it.severity));
    if (it.global) meta.push('<span class="tag gl">全球性</span>');
    meta.push(esc(it.dates[it.dates.length - 1]));
    var links = (it.links || []).slice(0, 3).map(function (l) {
      return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name.slice(0, 34)) + '</a>';
    }).join("");
    return '<div class="card' + (it.type === "pain" ? " pain" : "") + '">' +
      '<div class="t">' + esc(it.title) + '</div>' +
      '<div class="m">' + meta.join("") + '</div>' +
      (it.summary ? '<div class="s clamp">' + esc(it.summary) + '</div>' : "") +
      (links ? '<div class="lk">' + links + '</div>' : "") +
      '</div>';
  }

  function renderDetail() {
    var box = el("detail");
    if (state.sel && nodes[state.sel]) {
      var n = nodes[state.sel];
      var news = n.items.filter(function (i) { return i.type === "news"; });
      var pain = n.items.filter(function (i) { return i.type !== "news"; }).sort(function (a, b) {
        var r = { high: 3, mid: 2, low: 1, unknown: 0 };
        return r[b.severity] - r[a.severity];
      });
      box.innerHTML =
        '<span class="close" id="btn-clear">清除选中</span>' +
        '<h2>' + esc(n.m.name) + '</h2>' +
        '<div class="sub">' + esc(n.m.en) + ' · ' + esc(n.m.region) + ' · ' + n.m.lat.toFixed(1) + '°, ' + n.m.lon.toFixed(1) + '° · 共 ' + n.count + ' 条</div>' +
        '<div class="sec"><div class="hd"><i style="background:#4fd6ff"></i>新闻 · ' + news.length + ' 条</div>' +
        (news.length ? news.map(itemCard).join("") : '<div class="empty">当前筛选下无新闻</div>') + '</div>' +
        '<div class="sec"><div class="hd"><i style="background:#ffb056"></i>产品痛点 · ' + pain.length + ' 条</div>' +
        (pain.length ? pain.map(itemCard).join("") : '<div class="empty">当前筛选下无痛点</div>') + '</div>';
      var bc = el("btn-clear");
      if (bc) bc.onclick = function () { select(null, false); };
      return;
    }
    // 全球概览
    var st = rebuild();
    var top = nodeList.filter(function (n) { return n.count > 0; }).sort(function (a, b) { return b.count - a.count; }).slice(0, 9);
    var max = top.length ? top[0].count : 1;
    var latestNews = DATA.items.filter(function (i) { return i.type === "news" && matches(i); });
    box.innerHTML =
      '<h2>全球概览</h2>' +
      '<div class="sub">' + (activeDate() ? activeDate() : ("全部 " + DATA.dates.length + " 天") ) + ' · 点击地球上的星点或左侧国家，查看该国新闻与痛点</div>' +
      '<div class="sec"><div class="hd"><i style="background:#a98cff"></i>条目最多的市场</div><div class="rank">' +
      top.map(function (n) {
        return '<div class="r" data-m="' + n.m.id + '"><span class="rn">' + esc(n.m.name) + '</span>' +
          '<span class="rb"><span class="bar"><i style="width:' + Math.round(n.count / max * 100) + '%"></i></span></span>' +
          '<span class="rv">' + n.count + '</span></div>';
      }).join("") + '</div></div>' +
      '<div class="sec"><div class="hd"><i style="background:#4fd6ff"></i>新闻速览 · ' + latestNews.length + ' 条</div>' +
      (latestNews.length ? latestNews.slice(0, 8).map(itemCard).join("") : '<div class="empty">当前筛选下无新闻</div>') + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll(".r"), function (c) {
      c.onclick = function () { select(c.getAttribute("data-m"), true); };
    });
  }

  function refresh() {
    var st = rebuild();
    renderStats(st);
    renderControls();
    renderDetail();
    nodeList.forEach(function (n) {
      n.ring.visible = false;
      n.label.className = "lbl";
    });
    if (state.sel && nodes[state.sel]) {
      // 选中：用一圈静态柔光环做提示（不闪），配合标签高亮
      var sn = nodes[state.sel];
      sn.ring.visible = true;
      sn.ring.material.color.setHex(COL.sel);
      sn.ring.material.opacity = 0.9;
      sn.label.className = "lbl sel";
    }
  }

  // ---------------------------------------------------------------- 旋转 / 交互
  var rotY = 0, rotX = 0.18, targetY = 0, targetX = 0.18, flying = false;
  (function initView() {
    var v = viewRotation(22, 100);
    rotY = v.y; targetY = v.y; rotX = targetX = v.x;
  })();

  function applySelColors() {
    nodeList.forEach(function (n) {
      var isSel = (state.sel === n.m.id && n.baseCol);
      var hex = isSel ? COL.sel : (n.baseCol || COL.news);
      n.core.material.color.setHex(hex);
      n.halo.material.color.setHex(hex);
      n.halo.material.opacity = isSel ? 0.9 : 0.7;
      for (var ri = 0; ri < n.ripples.length; ri++) n.ripples[ri].material.color.setHex(hex);
      n.beam.material.color.setHex(hex);
    });
  }

  function select(mid, fly, auto) {
    state.sel = mid;
    if (mid && !auto) setSpin(false);   // 选中即暂停自转，方便阅读新闻
    if (mid && !auto && nodes[mid]) nodes[mid].flashT = performance.now();  // 仅手动选中闪一次
    applySelColors();
    if (mid && nodes[mid] && fly) {
      var v = viewRotation(nodes[mid].m.lat, nodes[mid].m.lon);
      var two = Math.PI * 2;
      var k = Math.round((rotY - v.y) / two);
      targetY = v.y + k * two;
      targetX = Math.max(-0.85, Math.min(0.85, v.x));
      flying = true;
    }
    refresh();
  }

  var drag = null, moved = 0;
  var dom = renderer.domElement;
  dom.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY, ry: rotY, rx: rotX };
    moved = 0; flying = false;
    dom.setPointerCapture(e.pointerId);
  });
  dom.addEventListener("pointermove", function (e) {
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
      rotY = drag.ry + dx * 0.005;
      rotX = Math.max(-0.9, Math.min(0.9, drag.rx + dy * 0.004));
      targetY = rotY; targetX = rotX;
      hideTip();
      return;
    }
    hoverPick(e);
  });
  dom.addEventListener("pointerup", function (e) {
    if (drag && moved < 5) clickPick(e);
    drag = null;
  });
  dom.addEventListener("pointerleave", function () { drag = null; hideTip(); });
  dom.addEventListener("wheel", function (e) {
    e.preventDefault();
    camDist = Math.max(165, Math.min(620, camDist + e.deltaY * 0.25));
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); toggleSpin(); }
  });

  var ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
  function pick(e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    ray.setFromCamera(pointer, camera);
    var list = hits.filter(function (h) { return nodes[h.userData.mid].count > 0; });
    var hit = ray.intersectObjects(list, false);
    return hit.length ? hit[0].object.userData.mid : null;
  }
  function clickPick(e) {
    var mid = pick(e);
    select(mid, !!mid);
  }
  var tip = el("tip");
  function hoverPick(e) {
    var mid = pick(e);
    if (!mid) { hideTip(); return; }
    var n = nodes[mid];
    tip.style.display = "block";
    tip.style.left = Math.min(window.innerWidth - 220, e.clientX + 14) + "px";
    tip.style.top = Math.min(window.innerHeight - 90, e.clientY + 14) + "px";
    tip.innerHTML = '<b>' + esc(n.m.name) + '</b> <span>' + esc(n.m.en) + '</span><br>' +
      '<span>新闻 ' + n.news + ' 条 · 痛点 ' + n.pain + ' 条' + (n.high ? ' · 高严重度 ' + n.high : '') + '</span>';
  }
  function hideTip() { tip.style.display = "none"; }

  function setSpin(v) {
    state.spin = v;
    var b = el("btn-spin");
    b.className = "chip" + (v ? " on" : "");
    b.textContent = v ? "自转中" : "已暂停";
  }
  function toggleSpin() { setSpin(!state.spin); }
  el("btn-spin").onclick = toggleSpin;
  el("btn-cruise").onclick = function () {
    state.cruise = !state.cruise;
    this.className = "chip" + (state.cruise ? " on" : "");
    if (state.cruise && !state.spin) toggleSpin();
  };
  el("speed").oninput = function () { state.speed = parseInt(this.value, 10) / 100; };  // 0.10 ~ 2.20 rad/s（约 63~3 秒/圈）
  state.speed = 0.15;  // 默认较慢：约 42 秒转一圈
  el("btn-today").onclick = function () { state.mode = "today"; refresh(); };
  el("btn-all").onclick = function () { state.mode = "all"; refresh(); };
  el("q").oninput = function () { state.q = this.value; renderControls(); };

  // ---------------------------------------------------------------- 面板收展
  el("left-toggle").onclick = function () {
    document.body.classList.toggle("left-collapsed");
    var c = document.body.classList.contains("left-collapsed");
    this.querySelector("span").textContent = c ? "筛选" : "收起";
    this.querySelector("b").textContent = c ? "›" : "‹";
  };
  el("right-toggle").onclick = function () {
    document.body.classList.toggle("right-expanded");
    var e = document.body.classList.contains("right-expanded");
    this.querySelector("span").textContent = e ? "还原" : "放大";
  };
  window.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (e.key === "[") el("left-toggle").click();
    else if (e.key === "]") el("right-toggle").click();
  });

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------------------------------------------------------- 主循环
  var tmpV = new THREE.Vector3(), tmpN = new THREE.Vector3(), tmpC = new THREE.Vector3();
  var last = performance.now(), cruiseT = 0, cruiseI = 0;
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;

    if (flying) {
      rotY += (targetY - rotY) * 0.09;
      rotX += (targetX - rotX) * 0.09;
      if (Math.abs(targetY - rotY) < 0.002 && Math.abs(targetX - rotX) < 0.002) flying = false;
    } else if (state.spin && !drag) {
      rotY += state.speed * dt;          // state.speed 单位：弧度/秒
    }
    globe.rotation.y = rotY;
    globe.rotation.x = rotX;
    camera.position.z = camDist;
    camera.lookAt(0, 0, 0);

    // 自动巡航
    if (state.cruise && state.spin && !flying && !drag) {
      cruiseT += dt;
      if (cruiseT > 7) {
        cruiseT = 0;
        var hot = nodeList.filter(function (n) { return n.count > 0; });
        if (hot.length) {
          cruiseI = (cruiseI + 1) % hot.length;
          select(hot[cruiseI].m.id, true, true);
        }
      }
    }

    // 标记缩放 + 标签
    for (var i = 0; i < nodeList.length; i++) {
      var n = nodeList[i];
      n.scale += (n.target - n.scale) * 0.12;
      var vis = n.scale > 0.03;
      n.core.visible = vis; n.halo.visible = vis; n.hit.visible = vis;
      if (!vis) {
        n.label.style.display = "none";
        n.beam.visible = false;
        for (var rj = 0; rj < n.ripples.length; rj++) n.ripples[rj].visible = false;
        continue;
      }
      var base = 5.5 + Math.min(16, n.count * 0.55);
      n.core.scale.setScalar(n.scale * (n.count > 6 ? 1.5 : 1.25));
      n.halo.scale.set((base + 5) * n.scale, (base + 5) * n.scale, 1);   // 静态柔光，不闪烁
      n.ring.scale.set(base + 9, base + 9, 1);                            // 仅选中可见（refresh 控制）

      // 选中后只闪一次涟漪，之后收起，避免一直闪
      var ft = n.flashT ? (now - n.flashT) / 1100 : 99;
      if (ft >= 0 && ft <= 1) {
        for (var ri = 0; ri < n.ripples.length; ri++) {
          var rp = n.ripples[ri];
          var lt = ft - ri * 0.4;
          if (lt < 0 || lt > 1) { rp.visible = false; continue; }
          var rs = (4 + lt * 26) * (0.7 + Math.min(1.2, n.count * 0.1));
          rp.scale.set(rs, rs, 1);
          rp.material.opacity = (1 - lt) * 0.5 * n.scale;
          rp.visible = true;
        }
      } else {
        for (var rk = 0; rk < n.ripples.length; rk++) n.ripples[rk].visible = false;
      }

      // 竖直光柱（静态，不闪烁）
      var bh = 9 + Math.min(30, n.count * 1.6);
      n.beam.visible = true;
      n.beam.scale.set(1, bh, 1);
      n.beam.position.copy(n.dir).multiplyScalar(R + bh / 2);
      n.beam.material.opacity = (state.sel === n.m.id ? 0.5 : 0.3) * n.scale;

      tmpV.copy(n.pos).applyMatrix4(globe.matrixWorld);
      tmpN.copy(tmpV).normalize();
      tmpC.copy(camera.position).sub(tmpV);
      var front = tmpN.dot(tmpC) > 0;
      if (!front) { n.label.style.display = "none"; continue; }
      var p = tmpV.clone().project(camera);
      var x = (p.x * 0.5 + 0.5) * window.innerWidth;
      var y = (-p.y * 0.5 + 0.5) * window.innerHeight;
      n.label.style.display = "block";
      n.label.style.left = x + "px";
      n.label.style.top = (y - 16) + "px";
      n.label.innerHTML = '<b>' + esc(n.m.name) + '</b><i>' + n.count + '</i>';
    }

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------- 启动
  el("gen").textContent = DATA.generated_at;
  el("srcs").textContent = (DATA.sources.news + " · " + DATA.sources.social).replace(/\\/g, "/");
  refresh();
  requestAnimationFrame(loop);
  // 调试钩子（无副作用，供无头验证/自动化测试用）
  window.NRI_DEBUG = { select: select, refresh: refresh, state: state, nodes: nodes, DATA: DATA };
})();
</script>
</body>
</html>
